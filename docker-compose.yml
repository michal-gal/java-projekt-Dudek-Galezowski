version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: bookstore_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      #zabezpieczenei przed race condition
      test: ["CMD-SHELL", "pg_isready -U admin -d bookstore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: spring_backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/bookstore_db
      - DB_USER=admin
      - DB_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: